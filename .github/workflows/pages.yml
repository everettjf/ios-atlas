name: Deploy iOS Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check dependency path logic
        run: node tools/test_reach.mjs
      - name: Check directory browse logic
        run: node tools/test_tree.mjs
      - name: Check live-device privacy export
        run: python3 tools/test_live_device_pipeline.py
      - name: Check live library name matches
        run: python3 tools/test_live_load_targets.py
      - name: Build static site
        run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
