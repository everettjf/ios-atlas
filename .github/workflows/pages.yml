name: Build iOS Atlas Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency path logic
        run: node tools/test_reach.mjs
      - name: Check directory browse logic
        run: node tools/test_tree.mjs
      - name: Check live-device privacy export
        run: python3 tools/test_live_device_pipeline.py
      - name: Check live library name matches
        run: python3 tools/test_live_load_targets.py
      - name: Build static site
        run: python3 tools/build_site.py
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish branch and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git dist/ pages/
          touch pages/.nojekyll
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Publish site from ${GITHUB_SHA}"
            git -C pages push origin HEAD:gh-pages
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
