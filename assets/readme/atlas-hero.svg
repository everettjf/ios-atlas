<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">iOS Atlas — the system, laid bare</title>
  <desc id="description">A dark technical field map with a glowing orange iOS system core connected to device files, dyld cache images, and static metadata.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090909"/><stop offset="1" stop-color="#1b100d"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#ff6645" stop-opacity=".28"/><stop offset=".6" stop-color="#ff6645" stop-opacity=".05"/><stop offset="1" stop-color="#ff6645" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6645"/><stop offset="1" stop-color="#ff9b79"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#684132" stroke-opacity=".2" stroke-width="1"/></pattern>
    <clipPath id="right"><rect x="665" y="0" width="535" height="430"/></clipPath>
  </defs>
  <rect width="1200" height="430" fill="url(#base)"/>
  <rect x="0.5" y="0.5" width="1199" height="429" fill="none" stroke="#5b3529"/>
  <path d="M34 0V430M0 35H1200M0 394H1200" stroke="#5b3529" stroke-opacity=".75"/>
  <path d="M34 35h26M34 35v26M1166 35h-26M1166 35v26M34 394h26M34 394v-26M1166 394h-26M1166 394v-26" fill="none" stroke="#ff6645" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1" font-size="11" fill="#ff8062">
    <text x="76" y="80">FIELD NOTES / BUILD 23A355</text><text x="1123" y="80" text-anchor="end">FIG. 01 — SYSTEM ANATOMY</text>
  </g>
  <path d="M76 97h38" stroke="#ff6645" stroke-width="2"/>
  <text x="70" y="197" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="88" letter-spacing="-6" fill="#f6f1eb">iOS <tspan fill="#ff6645">ATLAS</tspan></text>
  <text x="77" y="246" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#cfc4bb">The system, laid bare.</text>
  <text x="78" y="285" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9f938c">One device. One build. Every claim has a trail.</text>
  <g font-family="Courier New, monospace" font-size="11" letter-spacing="1" fill="#ff9176">
    <text x="77" y="363">01 / DEVICE</text><text x="229" y="363">02 / CACHE</text><text x="373" y="363">03 / EVIDENCE</text>
  </g>
  <g clip-path="url(#right)">
    <rect x="665" y="35" width="500" height="359" fill="url(#grid)"/>
    <circle cx="918" cy="214" r="250" fill="url(#halo)"/>
    <circle cx="918" cy="214" r="173" fill="none" stroke="#ff6645" stroke-opacity=".33" stroke-dasharray="3 7"/>
    <circle cx="918" cy="214" r="132" fill="none" stroke="#ff6645" stroke-opacity=".39"/>
    <circle cx="918" cy="214" r="89" fill="#17100e" stroke="url(#edge)" stroke-width="2"/>
    <path d="M665 214h500M918 35v359" stroke="#ff6645" stroke-opacity=".14"/>
    <circle cx="796" cy="91" r="5" fill="#ff6645"/><circle cx="1040" cy="337" r="5" fill="#ff6645"/>
    <g font-family="Courier New, monospace" text-anchor="middle">
      <text x="918" y="194" font-size="12" letter-spacing="2" fill="#ff9176">SYSTEM CORE</text>
      <text x="918" y="225" font-size="26" font-weight="700" fill="#f6f1eb">23A355</text>
      <text x="918" y="246" font-size="10" fill="#afa198">arm64e / iPhone 11</text>
    </g>
    <g font-family="Courier New, monospace" font-size="10" letter-spacing=".5">
      <rect x="678" y="111" width="151" height="56" fill="#17110f" stroke="#98513b"/><text x="691" y="131" fill="#ff795a">01 / DEVICE</text><text x="691" y="151" fill="#e8ded6">439,365 paths</text>
      <rect x="1021" y="124" width="154" height="56" fill="#17110f" stroke="#98513b"/><text x="1034" y="144" fill="#ff795a">02 / DYLD CACHE</text><text x="1034" y="164" fill="#e8ded6">4,170 images</text>
      <rect x="708" y="289" width="168" height="56" fill="#17110f" stroke="#98513b"/><text x="721" y="309" fill="#ff795a">03 / STATIC SURFACE</text><text x="721" y="329" fill="#e8ded6">methods + symbols</text>
    </g>
  </g>
  <g font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#a99b92"><text x="76" y="414">INDEPENDENT SYSTEM RESEARCH</text><text x="1123" y="414" text-anchor="end">iOS 26.0.1 / 23A355</text></g>
</svg>
